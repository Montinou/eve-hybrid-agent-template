# Second external probe: is the agent's SANDBOX usable? (docs/07-ops.md)
#
# WHY THIS EXISTS, separately from health-check.yml
#
# `/eve/v1/health` answering 200 does not mean the agent can work. `eve build`
# records eve's sandbox template as a snapshot; the snapshot expires after
# SANDBOX_SNAPSHOT_EXPIRATION_MS without use; and "The runtime never recreates
# a template. Run `eve build` again and deploy its output"
# (node_modules/eve/docs/sandbox/troubleshooting.mdx). When that snapshot
# lapses, no new session can open a sandbox — while the health endpoint stays
# green. An agent built on this pattern ran 12 days that way before anyone
# noticed, because the only visible symptom was tool calls quietly degrading.
#
# So this asks the agent, from OUTSIDE, to run one command through its
# built-in `bash` tool. That opens a sandbox for the probe's new session,
# which is created from the build's template snapshot: exactly the path that
# fails when the snapshot is gone. It also counts as a use of the snapshot,
# which restarts its TTL. A missing or unhealthy answer alerts; the repair is
# a redeploy.
#
# Configure on THIS repo (Settings → Secrets and variables → Actions):
#   vars.EVE_HEALTH_URL     e.g. https://<deployment>/eve/v1/health
#   vars.ALERT_EMAIL_FROM   verified Resend sender
#   vars.ALERT_EMAIL_TO     recipient(s), comma-separated
#   secrets.RESEND_API_KEY  Resend API key
#   secrets.AGENT_API_KEY   an API key your eve channel accepts as a bearer token.
#                           The template's agent/channels/eve.ts admits only
#                           Vercel OIDC and local dev until you add an API-key
#                           verifier there; see scripts/orchestrate.mjs (EVE_TOKEN).
name: Sandbox health
on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

# Least privilege: the job only checks out the repository to run
# scripts/orchestrate.mjs.
permissions:
  contents: read

jobs:
  sandbox:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Resolve agent base URL
        id: base
        run: |
          if [ -z "$HEALTH_URL" ]; then
            echo "::error::vars.EVE_HEALTH_URL is unset — cannot locate the agent."
            exit 1
          fi
          echo "url=${HEALTH_URL%/eve/v1/health}" >> "$GITHUB_OUTPUT"
        env:
          HEALTH_URL: ${{ vars.EVE_HEALTH_URL }}

      # The agent is asked to end its reply with one machine-readable line, so
      # this job never parses prose. A missing line is treated exactly like an
      # unhealthy one: "could not confirm" is not "fine".
      - name: Ask the agent for its sandbox state
        id: probe
        run: |
          if [ -z "$EVE_TOKEN" ]; then
            echo "::error::secrets.AGENT_API_KEY is unset — the eve channel would answer 401."
            exit 1
          fi
          set -o pipefail
          node scripts/orchestrate.mjs "Use your bash tool to run exactly this command: echo SANDBOX_OK. Then reply with NOTHING except a single line, exactly: EVE_SANDBOX_STATUS=healthy if the command ran and printed SANDBOX_OK, or EVE_SANDBOX_STATUS=unhealthy followed by a space and the tool's error text if it did not. Deliver no message to any channel." \
            2>&1 | tee probe.log || true
          if grep -q "EVE_SANDBOX_STATUS=healthy" probe.log; then
            echo "eve sandbox healthy"
            exit 0
          fi
          detail=$(grep -o "EVE_SANDBOX_STATUS=unhealthy.*" probe.log | head -1)
          if [ -z "$detail" ]; then
            detail="the agent never reported EVE_SANDBOX_STATUS (turn failed, timed out, or answered off-contract)"
          fi
          echo "detail=$detail" >> "$GITHUB_OUTPUT"
          echo "::error::$detail"
          exit 1
        env:
          EVE_AGENT_URL: ${{ steps.base.outputs.url }}
          EVE_TOKEN: ${{ secrets.AGENT_API_KEY }}

      - name: Alert via Resend
        if: failure()
        run: |
          payload=$(jq -n \
            --arg from "$ALERT_EMAIL_FROM" \
            --arg to "$ALERT_EMAIL_TO" \
            --arg detail "${DETAIL:-probe step failed before reporting}" \
            --arg at "$(date -u +%FT%TZ)" \
            '{from: $from, to: ($to | split(",")), subject: "[agent] eve sandbox unhealthy", text: ("The agent could not open a sandbox at " + $at + ".\n\n" + $detail + "\n\nConsequence while this holds: new sessions cannot open a sandbox, so the GitHub-channel checkout and the bash/read_file tools are unavailable. Most likely cause: eve's build-time template snapshot expired or was deleted. Repair: redeploy the project (a new build prepares a new template snapshot); see docs/06-sandbox-lifecycle.md.")}')
          curl -s -X POST https://api.resend.com/emails \
            -H "Authorization: Bearer $RESEND_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$payload"
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL_FROM: ${{ vars.ALERT_EMAIL_FROM }}
          ALERT_EMAIL_TO: ${{ vars.ALERT_EMAIL_TO }}
          DETAIL: ${{ steps.probe.outputs.detail }}
